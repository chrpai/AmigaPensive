SYSDATA:Log/Guardian                                      ; Complete path for the Guardian logfile
Run <>NIL: SYS:Rexxc/Rx DOORS:Guardian/ClosePort.rexx %d  ; Complete path for the Closeport.rexx script
Run <>NIL: CNET:bbs %d                                    ; Command line to launch a BBS port
Run SYS:ShutAll/ShutAll                                   ; Command line to invoke ShutAll
*** WARNING! A critical error has occurred. Port %d has crashed. Shutdown sequence has commenced. You have THREE minutes to logoff.     ; After a crash: first OLM to send to online users
*** WARNING! You will be disconnected in ONE minute. This is your last chance to logoff normally!                                       ; After a crash: last OLM to send to online users before disconnecting
*** System shutdown sequence commenced! You have THREE minutes to logoff.                                                               ; When doing a shutdown: first OLM to send to online users
*** System shutdown imminent! You will be disconnected in ONE minute. This is your last chance to logoff normally!                      ; When doing a shutdown: last OLM to send to online users before disconnecting
Run <>NIL: DOORS:Guardian/DosOLM T=%d M=%s         ; Command line to invoke DOSOlm
Run <>NIL: DOORS:Guardian/TaskCloser %s            ; Command line to invoke TaskCloser
Run <>NIL: CNET:mail-task                          ; Command line to run mail-task
Run <>NIL: CNET:file-task                          ; Command line to run file-task
Run <>NIL: CNET:yank-task                          ; Command line to run yank-task
Run <>NIL: CNET:news-task                          ; Command line to run news-task
Run <>NIL: CNET:cnsmtpd                            ; Command line to run cnsmtpd
