120 ; Time in seconds between first and last warnings
60  ; Time in seconds between the last warning and forced logout
20  ; Time, in seconds, that Guardian will wait for ShutAll to unmount all devices
40  ; Time in seconds which Guardian will wait for CNet to load all the ports and tasks
60  ; Time in seconds which Guardian will wait for CNet to close all the ports and tasks
15  ; Time in seconds which Guardian will wait for a crashed port to close
5   ; Time in seconds which Guardian will wait for a port to load
20  ; Number of times (one every 6 seconds) Guardian will check if Control is running on startup before timing out. Used with the WAIT option
30  ; Time in seconds which Guardian will wait to confirm a port crash (used only if no one was on that port)
