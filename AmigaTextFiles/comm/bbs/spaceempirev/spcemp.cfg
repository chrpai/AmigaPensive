line 1 - name of text file for list of scores
line 2 - name of text file for todays news
line 3 - name of text file for yesterdays news
line 4 - Message base sig number  (SKYLINE ONLY)
line 5 - Max number of Players allowed to play at once   Not working yet
line 6 - Max number of Teams allowed in a game at once   Not working yet
line 7 - Number of turns allowed a day
line 8 - Tells which message base link you want to use.   (SKYLINE ONLY)
         yes =   Use a message base sig, the sig number is needed then
         no  =   Tells program to use a online system for message being
                 sent to players.    Best to you the yes here.  Players
                 are allowed to use the system which allows full messages.
                 Other wise it will only be a one line message to another
                 player.
         C-Net sysop for right now you get a one line message base only.
         I can do the same thing as SKYLINE but just didn't put it in there
         yet. I'm working on it right now.
line 9 - Number of Turns in Protection at start of the game.
line 10- Turns on/off option to view Space Empire news file.
line 11- Number of Total planets aviable for one game.
line 12- Path for where the game data is going to go to.
         This option is only for C-Net.  And C-Net Sysops this file has to
         be where the main Pfiles: is located on your hard drive.  All
         other data and text files for Space Empire will go to that directory
line 13- Number od inactive days.  Number of day a player can not play
	 before he gets deleted.
line 14- The score to get to win the game.
	 Min. score to win is   80000
	 Max. score to win is 1000000
         Anything below min. score or high then max score will be set to
	 either one of those numbers...


