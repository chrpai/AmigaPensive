;$VER: topcaller.ini 1.2 (19.11.95)
;
;======================= Modus angeben ==================================
;
modus=caller
;
;======================= Angaben für alle Modi ==========================
;--- AusgabeFenster = ja: Console-Window für temporäre Anzeigen von
;                         PMBSList aufmachen (zur Kontrolle)
AusgabeFenster=ja
;
;--- Farben = ja: ANSI-/Prometheus-Farbcodes in die Datei einfügen
;             nein: für Listen in reinem ASCII-Text
Farben=ja
;
;--- ausgabedatei= Name der Datei (ggf. mit Pfad), die erzeugt wird
;
ausgabedatei=prometheus:texte/topcaller.txt
;
;--- DateiAnhängen=ja: erzeugte Liste an den unter 'ausgabedatei'
;                      angegebenen Namen ANHÄNGEN (statt überschreiben)
;                      man kann so mehrere Listen zu einem Text zusammen-
;                      fassen, default: DateiAnhängen=nein;
DateiAnhängen=nein
;
;--- BildschirmLöschen=ja: Bildschirm-Löschcode (\f) am Anfang der Liste
;                          einfügen (default), nein: kein Löschcode
BildschirmLöschen=ja
;
;--- warten= ja: nach dem Anzeigen der Liste auf Tastendruck warten
;---             (%X - in den Text einfügen)
Warten=ja
;
;======================= Angaben für 'caller'-Modus ======================
;--- TopAnzahl=  Anzahl der Zeilen der "Top-Callers-Liste"
;
TopAnzahl=14
;
;--- Daten= Dateiname (mit Pfadangabe), die die Vergleichswerte für die
;           Top-Caller-Liste aufnimmt
;
Daten=prometheus:daten/topcaller.dat
;
;--- FilterUser= User, die in der Top-Caller-Liste nicht berücksichtigt
;                werden sollen, Sysops, Gäste etc. (kann mehrfach ein-
;                gesetzt werden!!)
FilterUser=Sysop
FilterUser=Gast
;
;--- UserKlasse= User werden entsprechend ihrer Anrufanzahl in Kategorien
;                eingeteilt
;UserKlasse=100,Top User
;UserKlasse=50,Normal User
;UserKlasse=10,Lame User
;UserKlasse=1,Neu User
;
;--- Verbose=ja/nein   statt den sich drehenden Strichen wird bei
;                      Verbose=ja der Username im Console-Window
;                      eingesetzt (zur besseren Fehlersuche)
;                      Default: Verbose=nein
;Verbose=nein
