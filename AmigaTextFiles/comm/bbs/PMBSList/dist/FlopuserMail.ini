;$VER: flopuserMail.ini 1.2 (19.11.95)
;
;======================= Modus angeben ==================================
;
modus=flopuser
;
;======================= Angaben für alle Modi ==========================
;--- AusgabeFenster = ja: Console-Window für temporäre Anzeigen von
;                         PMBSList aufmachen (zur Kontrolle)
AusgabeFenster=ja
;
;--- Farben = ja: ANSI-/Prometheus-Farbcodes in die Datei einfügen
;             nein: für Listen in reinem ASCII-Text
Farben=ja
;
;--- daten= Name der Datei (ggf. mit Pfad), die die Vergleichswerte
;           für den nächsten Aufruf von PList vorhält
daten=prometheus:daten/flopusermail.dat
;
;--- BildschirmLöschen=ja: Bildschirm-Löschcode (\f) am Anfang der Liste
;                          einfügen (default), nein: kein Löschcode
BildschirmLöschen=nein
;
;--- warten= ja: nach dem Anzeigen der Liste auf Tastendruck warten
;---             (%X - in den Text einfügen)
Warten=nein
;
;--- TopAnzahl=  Anzahl der Zeilen der Liste
;
TopAnzahl=50
;
FilterUser=SYSOP
FilterUser=JEFF
FilterUser=GAST
FilterUser=SYSTEM
;
Monatstage=3,13,23
;
ErzeugeMail=ja
Absender=SYSTEM
Empfänger=SYSOP
AntwortAn=SYSOP
StartSorter=ja
