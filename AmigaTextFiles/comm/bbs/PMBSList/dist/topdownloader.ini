; $VER topdownloader.ini 1.7 (17.4.96)
;
; Zeilen, die mit ; beginnen, sind Kommentarzeilen, zum Ein-/Ausschalten
; der Optionen, einfach die ; am Zeilenanfang entfernen oder setzen
;
;======================= Modus angeben ==================================
;
modus=topdownloader
;
;======================= Angaben für alle Modi ==========================
;--- AusgabeFenster = ja: Console-Window für temporäre Anzeigen von
;                         PMBSList aufmachen (zur Kontrolle)
AusgabeFenster=ja
;
;--- Farben = ja: ANSI-/Prometheus-Farbcodes in die Datei einfügen
;             nein: für Listen in reinem ASCII-Text
Farben=ja
;
;--- ausgabedatei= Name der Datei (ggf. mit Pfad), die erzeugt wird
;
ausgabedatei=prometheus:texte/topdownloader.txt
;
;--- BildschirmLöschen=ja: Bildschirm-Löschcode (\f) am Anfang der Liste
;                          einfügen (default), nein: kein Löschcode
BildschirmLöschen=ja
;
;--- warten= ja: nach dem Anzeigen der Liste auf Tastendruck warten
;---             (%X - in den Text einfügen)
Warten=ja
;
;--- Verbose=ja: Anzeige der Usernamen während der Erstellung der Liste
Verbose=nein
;
;======================= Angaben für Modus 'topdownloader' ==============
;--- TopAnzahl=  Anzahl der Zeilen der Liste"
;
TopAnzahl=20
;
;--- Daten= Dateiname (mit Pfadangabe), die die Vergleichswerte für die
;           Liste aufnimmt
Daten=prometheus:daten/topdownloader.dat
;
;--- UserKlassen (siehe Doku)
;
UserKlasse=20000,**** Mega-Sauger
UserKlasse=10000,***  Dauer-Sauger
UserKlasse=5000,**   Normal-Sauger
UserKlasse=1,*    Staub-Sauger
;
;--- User, die nicht in der Liste erscheinen sollen
;
FilterUser=SYSOP
;FilterUser=SYSTEM
;
;=================================================================
;--- Mailspezifikationen für ZConnect-kompatible Mails
;
;--- ErzeugeMail=ja: erzeuge ZConnect-kompatible Mail anstatt eines
;                    Textfiles, in diesem Fall wird der Parameter
;                    ausgabedatei= (s.o) nicht beachtet!
;ErzeugeMail=ja
;
Absender=SYSTEM
; --- Empfänger (Brettname (/GANZER_BRETTNAME) oder Username (SYSOP)
Empfänger=SYSOP
AntwortAn=SYSOP
;--- StartSorter (Prometheus-Sorter nach dem Erzeugen der Mail starten?)
StartSorter=ja
;


