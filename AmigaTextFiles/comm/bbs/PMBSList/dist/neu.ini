;$VER: neu.ini 1.4 (16.3.96)
;
;======================= Modus angeben ==================================
;
modus=neu
;
;======================= Angaben für alle Modi ==========================
;--- AusgabeFenster = ja: Console-Window für temporäre Anzeigen von
;                         PMBSList aufmachen (zur Kontrolle)
AusgabeFenster=ja
;
;--- Farben = ja: ANSI-/Prometheus-Farbcodes in die Datei einfügen
;             nein: für Listen in reinem ASCII-Text
Farben=ja
;
;--- brettliste=  Text-Datei mit GANZEN BRETTNAMEN (!)
;
brettliste=prometheus:pmbslist.lst
;
;--- ausgabedatei= Name der Datei (ggf. mit Pfad), die erzeugt wird
;
ausgabedatei=Prometheus:texte/neulist.txt
;
;--- DateiAnhängen=ja: erzeugte Liste an den unter 'ausgabedatei'
;                      angegebenen Namen ANHÄNGEN (statt überschreiben)
;                      man kann so mehrere Listen zu einem Text zusammen-
;                      fassen, default: DateiAnhängen=nein;
DateiAnhängen=nein
;
;--- BildschirmLöschen=ja: Bildschirm-Löschcode (\f) am Anfang der Liste
;                          einfügen (default)
BildschirmLöschen=ja
;
;--- warten= ja: nach dem Anzeigen der Liste auf Tastendruck warten
;---             (%X - in den Text einfügen)
Warten=ja
;
;======================= Angaben für Modus 'neu' ========================
;--- tage= Anzahl der Tage für die "Neue-Uploads-Liste"
;---       im Top-Modus egal
;
tage=4
;
;--- TopDownload= ja: in die "Neue-Uploads-Liste" das Top-Download-File
;                     des Brettes einfügen
TopDownload=nein
;
;--- AvgDownload= ja: in die "Neue-Uploads-Liste" die durchschnittliche
;---                  Download-Zahl im Brett einfügen
AvgDownload=nein
;
;--- Leermeldung=ja : gabs in einem Brett keine Binäruploads so wird das
;                     Brett trotzdem ausgegeben, zusammen mit einer
;                     enstsprechenden Meldung
Leermeldung=nein
;
;--- Sortierung=neu : Liste wird neu->alt sortiert (also die neuesten
;                     Files zuerst), Sortierung=alt (die älteseten Files
;                     zuerst)
Sortierung=neu
;
;--- TageKorrigieren=ja: Die Zahl der Uploads pro Tag wird nicht durch
;                        die durch den Tage= - Parameter bestimmt,
;                        sondern durch den tatsächlich ältesten Upload
;                        innerhalb dieser Zeitspanne; wichtig, wenn man
;                        bei Tage=x angibt, und x > Alter der Mailbox
;                  nein: Uploads pro Tag = Uploads / Tage=-Parameter
;                        (default)
TageKorrigieren=ja;
;
;--- Uploader=ja: nach den neuen Uploads auch noch die Uploader mit der
;                 Anzahl ihrer Uploads in die Liste mit aufnehmen
;           nein: keine Uploader in die Liste mit aufnehmen
Uploader=ja
;
;--- Systemmeldung=ja: nach der Fertigstellung der Liste eine OLM an
;                      alle Ports verschicken, auf denen ein User eingeloggt
;                      ist
;                nein: keine OLM
Systemmeldung=ja
