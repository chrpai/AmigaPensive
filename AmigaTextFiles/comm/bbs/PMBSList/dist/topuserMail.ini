;$VER: topuserMail.ini 1.2 (19.11.95)
;
;======================= Modus angeben ==================================
;
modus=topuser
;
;======================= Angaben für alle Modi ==========================
;--- AusgabeFenster = ja: Console-Window für temporäre Anzeigen von
;                         PMBSList aufmachen (zur Kontrolle)
AusgabeFenster=ja
;
;--- Farben = ja: ANSI-/Prometheus-Farbcodes in die Datei einfügen
;             nein: für Listen in reinem ASCII-Text
Farben=ja
;
;--- daten= Name der Datei (ggf. mit Pfad), die die Vergleichswerte
;           für den nächsten Aufruf von PList vorhält
;
daten=prometheus:daten/topusermail.dat
;
;--- BildschirmLöschen=ja: Bildschirm-Löschcode (\f) am Anfang der Liste
;                          einfügen (default), nein: kein Löschcode
BildschirmLöschen=nein
;
;--- warten= ja: nach dem Anzeigen der Liste auf Tastendruck warten
;---             (%X - in den Text einfügen)
Warten=nein
;
;--- TopAnzahl=  Anzahl der Zeilen der Liste
;
TopAnzahl=50
;
FilterUser=SYSOP
FilterUser=JEFF
FilterUser=GAST
FilterUser=SYSTEM
;
; ================================================================
; --- Datumspezifikationen, an denen die Funktion auch tatsächlich
; ---  ausgeführt wird:
;
; --- Wochentage=
;                  wird Wochentage nicht angegeben, so wird Funktion
;                  an jedem Tag in der Woche ausgeführt
;Wochentage=0,1,3,5    (Sonntag,Montag, Mittwoch, Freitag)
;Wochentage=*          (jeder Wochentag)
;
; --- Monatstage=8,18,28 (am 8., 18. 28. jeden Monat)
;                  wird Monatstage nicht angegeben, so wird Funktion
;                  an jedem Tag im Monat ausgeführt
;Monatstage=8,18,28
;
; --- Monate=1,2,8 (im Januar, Februar, August)
;                  wird Monate nicht angegeben, so wird Funktion in jedem
;                  Monat ausgeführt
;
;=================================================================
;--- Mailspezifikationen für ZConnect-kompatible Mails
ErzeugeMail=ja
Absender=SYSTEM
; --- Empfänger (Brettname (/GANZER_BRETTNAME) oder Username (SYSOP)
Empfänger=/ALLGEMEINES
AntwortAn=SYSOP
;--- StartSorter (Prometheus-Sorter nach dem Erzeugen der Mail starten?)
StartSorter=ja
