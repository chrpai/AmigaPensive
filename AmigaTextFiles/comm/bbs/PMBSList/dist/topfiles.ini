;$VER: topfiles.ini 1.5 (21.3.96)
;
;======================= Modus angeben ==================================
modus=topfiles
; >>>>>>>>>>>>>>>  der alte Name top sollte gegen topfiles ausgetauscht
; >>>>>>>>>>>>>>>  werden, da top in zukünftigen Versionen nicht mehr
; >>>>>>>>>>>>>>>  unterstützt wird!
;
;======================= Angaben für alle Modi ==========================
;--- AusgabeFenster = ja: Console-Window für temporäre Anzeigen von
;                         PMBSList aufmachen (zur Kontrolle)
AusgabeFenster=ja
;
;--- Farben = ja: ANSI-/Prometheus-Farbcodes in die Datei einfügen
;             nein: für Listen in reinem ASCII-Text
Farben=ja
;
;--- brettliste=  Text-Datei mit GANZEN BRETTNAMEN (!)
;
brettliste=prometheus:pmbslist.lst
;
;--- ausgabedatei= Name der Datei (ggf. mit Pfad), die erzeugt wird
;
ausgabedatei=Prometheus:texte/toplist.txt
;
;--- DateiAnhängen=ja: erzeugte Liste an den unter 'ausgabedatei'
;                      angegebenen Namen ANHÄNGEN (statt überschreiben)
;                      man kann so mehrere Listen zu einem Text zusammen-
;                      fassen, default: DateiAnhängen=nein;
DateiAnhängen=nein
;
;--- BildschirmLöschen=ja: Bildschirm-Löschcode (\f) am Anfang der Liste
;                          einfügen (default), nein: kein Löschcode
BildschirmLöschen=ja
;
;--- warten= ja: nach dem Anzeigen der Liste auf Tastendruck warten
;---             (%X - in den Text einfügen)
Warten=ja
;
;======================= Angaben für Modus 'top' ========================
;--- TopAnzahl=  Anzahl der Zeilen der "Top-Downloads-Liste"
;
TopAnzahl=14
;
;--- Daten= Datei (mit Pfadangabe), die die Vergleichswerte für die
;           Top-Download-Liste aufnimmt
Daten=prometheus:Daten/toplist.dat
;
;--- Text= links / rechts, Brettname wird entweder links oder rechts-
;          endig ausgeben, wenn er zu breit für die Spalte ist
Text=rechts
;
;--- Punkte= ja / nein, sollen die letzten drei Stellen des Brettnamens
;                       durch Punkte (...) ersetzt werden, wenn Brett-
;                       name nicht in seiner vollen Länge in die Liste
;                       passt (default=ja)
Punkte=ja
