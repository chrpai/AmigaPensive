Write here how the counter should look like (%ld will be replaced by the
actual number of the file), but please read *FIRST* the text below to
better understand the format of the counter !

POSITION:     012345678901234567890
COUNTERLOOK.1=   DL: %ld
COUNTERLOOK.2=Demo downloaded %ld times
COUNTERLOOK.3=Downloaded->%ld
COUNTERLOOK.4=ASKII dl'ed: %ld
COUNTERLOOK.5=Phile dl'ed: %ld
COUNTERLOOK.6=   DL: %ld
COUNTERLOOK.10=Downloaded->%ld
COUNTERLOOK.13=  DL: %2.2ld times
COUNTERLOOK.17=Downloaded->%ld
COUNTERLOOK.18=Downloaded->%ld

Now you have to define the position of the counter inside your counterstring.
Defaults to 'Downloaded->%ld' with Position = 12, that's where %ld begins.
Remember to start your count at 0 (!) and always count also ESC Codes, as
the Reading of those special chars always count them one by one!

New for V0.3: If you want to have leading zeros for the counter, define the
counter as %2.2ld for example, this means that the counter will be 2 chars
long and if the counting is lower than 10, a leading zero will be added to
the counter.

NOTE: Please don't use color counters, because ByteAndi's NewFiles get's
in real trouble if you use them!!! Color counters destroy the whole output
of the Dirlisting, so as long as no other NewFiles Scanner is available,
please use only counters without any ESC Codes! Another Problem is the
Release Date option of Byteandi's FileID, if you have set it to on, you
won't ever see any counter below such files, because the Release Date of
FileID will overwrite the counter during the esc sequences used by FileID.
IF you want to have all files counted, you *MUST* disable the Release Date
option of FileID!!!

COUNTERPOS.1=6
COUNTERPOS.2=16
COUNTERPOS.3=12
COUNTERPOS.4=13
COUNTERPOS.5=13
COUNTERPOS.6=6
COUNTERPOS.10=12
COUNTERPOS.13=6
COUNTERPOS.17=12
COUNTERPOS.18=12

Here are now the settings to directly control mEGA-dLC's behavour. Please
look in the documentation for further details about these settings.

ALLOW_LOCAL_DOWNLOADS=YES

This Switch should be set if you won't wish to have also local downloads
counted. Set this to 'NO' in this case...default is 'YES'.

SKIP_ALL_OUTPUT=NO

Set this switch to 'YES' if you won't wish to have any text output when
mEGA-DLC is running. Defaults to NO, as there is really not much text
to display ;)
