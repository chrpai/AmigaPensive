; $VER NoTraffic.ini 1.9 (10.6.96)
; Default-Ini-File für ProWarnung (C) 1996 Jörg Fenin
;========================================================================
; folgende Zeilen sind die Default-Werte für ProWarnung
; zum Ändern einfach das Semikolon am Anfang der Zeile entfernen und
; Wert hinter dem = wie gewünscht ändern
;------------------------------------------------------------------------
; Zeilen, die mit einem Semikolon beginnen, werden von ProWarnung nicht
; beachtet!
;------------------------------------------------------------------------
;        Modus = NoTraffic, erzeugt eine Liste mit Brettern in denen
;                keine neuen Mails geschrieben / einsortiert wurden,
;                man kann so "tote" Netze herausfinden
Modus=NoTraffic
;
; -----------------
;        Tage = Anzahl der Tage, in denen keine neue Mails mehr
;               erschienen sind
Tage=30
;
; -----------------
;        ZConnect-Mail-Angaben
;
;Empfänger=SYSOP
;Absender=SYSTEM
;AntwortAn=SYSOP
;
;StartSorter=ja
;
; -----------------
;       Art des Dupechecks der Mail
;       PM=ja   -> kein Dupecheck (.prv)
;         =nein -> Dupecheck (.brt)
PM=ja
;
; -----------------
;Taskpri=-1
; -----------------
;       Datumsangaben -> siehe Guide-File!
;Wochentage=*
;Monatstage=*
;Monate=*
; -----------------
;       Fenster=ja  : öffnet MUI-Fenster für die Ausgabe
;Fenster=ja
; -----------------
;       Verbose=ja  : zeigt Brettnamen im Ausgabefenster an, der
;                     gerade bearbeitet wird
;               nein: zeigt keine Brettnamen an
;Verbose=nein
; -----------------
;       Brettnamen=links    : A0-AMIGA/A1-DFÜ/A11-PROM...
;                  rechts   : ...GA/A1-DFÜ/A11-PROMETHEUS
;                  zentriert: A0-AMIGA/.../A11-PROMETHEUS
;Brettnamen=zentriert
; -----------------
;       NurNetz=ja  : nur Netzbretter sind in der Liste enthalten
;               nein: alle Bretter werden kontrolliert
;NurNetz=nein
