;$VER Crunch.ini 1.9 (10.6.96)
; Ini-File für ProWarnung (C) 1995 Jörg Fenin
;========================================================================
; zum Ändern einfach das Semikolon am Anfang der Zeile entfernen und
; Wert hinter dem = wie gewünscht ändern
;------------------------------------------------------------------------
; Zeilen, die mit einem Semikolon beginnen, werden von ProWarnung nicht
; beachtet, hier sind einmal die Default-Werte angezeigt!
;------------------------------------------------------------------------
Modus=Crunch
;Tage=180
;
;----------
;
;     Tage1=n : listet zusätzlich (!) alle User auf, die überhaupt
;     nur 1x angerufen habe und zwar vor mindestens n Tagen
;     so kann man die User rauskicken, die sich nur eingetragen haben,
;     dann aber nie mehr angerufen haben. Logischerweise sollte
;     Tage1 < Tage sein.
;     Tage1=0 : solche User bleiben unberücksichtigt
Tage1=60
;
;Empfänger=SYSOP
;Absender=SYSTEM
;AntwortAn=SYSOP
;StartSorter=ja
;----------
;     PM=ja/nein
;        ja = Mail wird als PM (Endung .prv) verschickt (keine Dupe-Check)
;       nein= Mail wird als öffentliche Mail (Endung .brt) verschickt
;             (Dupe-Check)
;PM=ja
;Taskpri=-1
;
;----------
;     Datumsangaben, siehe Guide-File
;Wochentage=*
;Monatstage=*
;Monate=*
;
;----------
;     FilterUser=  diese User nicht in die Liste mit aufnehmen
;                  kann auch mehrfach vorkommen
FilterUser=SYSOP
FilterUser=SYSTEM
;
;----------
;     Verbose=ja/nein
;     ja  = zeigt während der Verarbeitung den Usernamen an
;     nein= es wird kein Username während der Verarbeitung angezeigt
;Verbose=nein

