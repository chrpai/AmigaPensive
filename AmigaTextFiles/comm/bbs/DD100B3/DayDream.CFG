ARC_FIDEXTRACT dh1:utils/XMash extract %A dt FILE_ID.DiZ
ARC_FIDADD.... -
+
ARC_TYPE...... F
ARC_EXTENSION. TXT
ARC_NAME...... Text file
ARC_TEST...... -
ARC_EXTRACT... -
ARC_ADD....... -
ARC_FAIL1..... -
ARC_FAIL2..... -
