BASE_LOWEST... -
BASE_HIGHEST.. -
BASE_MAXMSGS.. 1000
BASE_NAME..... Comments to SysOp
BASE_FIDOTAG.. -
BASE_ORIGIN... -
BASE_FIDOADD.. -
BASE_ALLOWPBLC N
BASE_ALLOWPRIV Y
BASE_NAMES.... R
BASE_QUOTE.... L
BASE_DEFGRAB.. Y
