
;First DayDream.DAT

;Board Name
;SysOp
;Ascii-send path
;Download path
;OpLogin DisplayMode
;System password
;New user password
;User editor password
;Filescan buffer size (kb)
;Preset for new users
;Idle in secs
;Conference to join if the user hasn't access to the autojoin-conference.
;Free bytes in HDD required for uploads
;Y = Ask reason to chat, N = Don't
;R = Real names in who etc, H = Handles
;L = Location in who etc, O = Org
;Y = Disable wildcards in logon prompt, N = Don't
;Ask new user questionaire if not answered yet. (Y/N)
;SysOp color (in chat)
;User color (in chat)
;Shell Password

!DAYDREAM.DAT
BBSNAME...... My DayDream
SYSOP........ Me
ASCIISENDPATH Dh1:ascii/
CHATDLPATH... dh1:download/
OP_DMODE..... 1
SYSTEM_PW.... -
NEWUSER_PW... -
USERED_PW.... -
FSCAN_BUFFER. 60
NEW_PRESET... 1
IDLE......... 180
AUTOCONF..... 1
FREEFORUL.... 2000000
ASK_REASON... Y
NAMEMODE..... H
LOCATION..... O
DISABLEWILDS. N
QUESTIONS.... N
SYSOP_COL.... [36m
USER_COL..... [35m
SHELL_PW..... SODOM
~


;Specs for Conferences.DAT

;Number of the conference
;Conference name
;Conference path
;Number of fileareas
;Uploads to ...
;Number of messagebases in conference
;Comments to ...
;Path of directory to place uploads in
;N S [XXX] for global new files scan. 
;Toggle conference on as a default for scanning new files
;+ = Base, * = Next Conf, ~ = End Conferences.DAT

;Number of base
;Area type. L = Local, E = Echomail, N = Netmail
;Lowest message (If -, will be taken from existing Conferences.DAT)
;Highest message (If -, will be taken from existing Conferences.DAT)
;Max messages
;Name of base
;FidoTAG or -
;FidoOrigin or -
;FidoAddress (4d!)
;Y = Allow Public messages, N = Do not Allow Public messages
;Y = Allow Private messages, N = Do not Allow Private messages
;R = Real Names, H = Handles 
;Quote method. L = Quoteline after quote, > = Plain "> ", I="> " with initials
;Toggle base as a default for global read and message grabbing

!CONFERENCES.DAT
CONF_NUMB..... 1
CONF_NAME..... Example Conference
CONF_PATH..... DayDream:ExampleConf/
CONF_FILEAREAS 2
CONF_UPLOADSTO 2
CONF_MSGBASES. 2
CONF_COMMENTS. 1
CONF_ULPATH... DayDream:ExampleConf/New/
CONF_NSAREAS.. A
CONF_DEFFSCAN. N
+
