;Archivers.dat.........

;D = Diskarchiver, F = Filearchiver
;Extension
;Archiver name
;Test Command
;Extract Command
;Add/Create Command
;Keyword for Archive Corrupted #1
;Keyword for Archive Corrupted #2
;Keyword for Archive Corrupted #3
;File_id.diz extract command
;File_Id.diz add command
;+ = Next archiver, ~ = End

!ARCHIVERS.DAT
ARC_TYPE...... F
ARC_EXTENSION. LHA
ARC_NAME...... LHA
ARC_TEST...... rx doors:rexxdir/mainostaja.rx %A
ARC_EXTRACT... dh1:utils/lha -m -M E %A %F
