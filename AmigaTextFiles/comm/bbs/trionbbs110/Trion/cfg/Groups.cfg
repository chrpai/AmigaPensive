SECTIONS     50 - 99                      ;Trion - Echomail

MAILGROUP    6,  "NLA-net"
SECTIONS     10, 13                       ;NLA - Netmail
SECTIONS     100 - 199                    ;NLA - Echomail


MAILGROUP    8,  "Fido-net"
SECTIONS     16                           ;Fido - netmail
SECTIONS     300 - 399                    ;Fido - Echomail

MAILGROUP    10,  "Amy-net"
SECTIONS     12, 15
SECTIONS     800 - 899

MAILGROUP    14,  "SySop's choice"
