;;;  Definition of File groups


FILEGROUP    1,  "All sections"
SECTIONS     1 - 65535

FILEGROUP    2,  "Amiga-files"
SECTIONS     1 - 15 , 20 - 59

FileGroup    3,  "PC-files"
Sections     1 - 15 , 60 - 99



;;;  Definition of Mail groups


MAILGROUP    1,  "All sections"
