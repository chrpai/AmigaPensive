
;;
;;   Configuration file for Trion BBS node 1
;;


; LOCAL
; NULLMODEM


ICON  370  0
FONT  cleanibm.font 8



SCREEN WIDTH   640
SCREEN HEIGHT  256
SCREEN DEPTH   4

;;  Monitor: Select a monitor:
;;       NTSC       640 x 200    60Hz   15,72Khz   (American 1084 mode)
;;       PAL        640 x 256    50Hz   15,60Khz   (Europe   1084 mode)
;;       MULTISCAN  640 x 480    58Hz   29,29Khz   (VGA/multisync monitors)
;;       EURO72     640 x 400    69Hz   29,25Khz
;;       EURO36     640 x 200    73Hz   15,76Khz
;;       SUPER72    448 x 306    71Hz   23,21Khz
;;       DBLNTSC    676 x 213    58Hz   27,66Khz
;;       DBLPAL     676 x 269    48Hz   27,50Khz
;;       DONTCARE   640 x 2xx    default screen mode

MONITOR  DONTCARE

;;  Use 'INTERLACE' and/or 'SUPER' for bigger screens 
;;  InterLace: boost vertical   resolution to  400 -  538 if possible
;;  Super:     boost horizontal resolution to 1280 - 1448 if possible

;INTERLACE
;SUPER



SERIAL DEVICE  serial.device
;  SERIAL DEVICE  nullmodem.device
;  SERIAL DEVICE  8n1.device
SERIAL UNIT    0
SERIAL BUFFER  16384

DEFAULT BAUD   38400         ;19200  38400  57600
DEFAULT LENGTH 28            ;default screen length


;  DataBits:    7 or 8  (default:  8 bits)
;  StopBits:    1 or 2  (default:  1 bit )
;  Parity:   OFF (no parity) or  ON  (parity Even) or ODD (parity ODD)

;  For normal BBS use       : (8n1) = 8 DataBits , 1 StopBit , Parity OFF
;  For Minitel (France) use : (7e1) = 7 dataBits , 1 StopBit , Pariy  ON


DATA BITS  8
STOP BITS  1
PARITY     OFF



; Modem Strings   '|' = carriage return,  '^' = escape karakter
; '^n' geeft n x 1/5 seconde pause  (BV '^1' = 1/5sec , '^5' = 1sec)
; '^|' geeft '|' karakter
; '^^' geeft '^' karakter (modem geeft bij dial fax tonen)
; Geen spaties in strings , zet dan de string tussen "..."  !!!

;INIT STRING &K3&D2S12=40&K3
;AAT+FAA=1;+FCLASS=0;+FLID="+31-70-3468783     ";+FCR=1;+FDCC=1,,0,2,0,0,0,5


;INIT  STRING  "ATZ|^5AT &F2 B0W2S95=2E0M1L1S2=255|"           ;suprafax normaal 
;INIT  STRING  "ATZ|^5AT &F2 B0W2S95=2E0M1L1S2=255#CID=1|"     ;suprafax CID
;INIT  STRING  "ATZ|^5AT &F2 B0W2S95=2E0M1L1S2=255|AT+FAA=1|"  ;suprafax FAX


INIT   STRING  "ATZ|^5AT &F2 B0W2S95=2E0M1L1#CID=1|AT+FAA=1|"
TERM   STRING  "ATZ|^5AT &F2 B0W2S95=2E1M1L1S2=43|"
DIAL   STRING  "ATS11=50DT"
ANSWER STRING  "ATA|"

RING    STRING     "RING"
CONNECT STRING     "CONNECT"
FAX     STRING     "FAX"
VOICE   STRING     "VOICE"


; number of RINGs before answering the modem
; If you expect CID (CallerID) set this to 2 else you can use 1
; In Debug mode .. CID will appear between RINGs in the log-file

RINGS   2


CARRIER DELAY  45     ;(secs)  Hoe lang op carrier wachten
CONNECT DELAY  30     ;(ticks) Als carrier hoelang voor snelheid bepalen 90->30
ESCAPE  DELAY   2     ;(secs)  Hoelang voor 'Press escape'   .. 5 -> 2
HANGUP  DELAY  25     ;(ticks) Hoelang carrier droppen bij ophangen


; file transfer protocols that the mailer can use
; specify all the protocols that you are able to use
; MAILER      HYDRA  ZEDZAP  DIRECTZAP  ZEDZIP  ZMODEM  (HYDRA8 JANUS KERMIT)

MAILER   ZEDZAP  DIRECTZAP  ZEDZIP  ZMODEM


; Path for downloading in terminal mode and local uploads (ending in : or /)

TERM PATH  RAM:

PAGE SAMPLE   trion:samples/startrek-Alert  3
BELL SAMPLE   trion:samples/startrek-comm

SLEEP WARNING  90

; SysopName for comment's to sysop and FidoCalls
; Use underscores for spaces in Sysop name or place between ""
; NOTE:  'SYSOP NAME' move to trion:cfg/TrionRM.cfg


SYSOP  NAME      Paul_Spijkerman
SYSTEM NAME      Amiga_Pet_Shop_BBS
SYSTEM CITY      Gasselte,Dr,NL,EUR
SYSTEM PHONE     +31-599-564696

; area number for sysop comments (must be higher then 0)

SYSOP COMMENTS  1

; 'validate level' The level a user gets when you press F4

VALIDATE LEVEL  10

; local editor to Use .. max 19 characters.

EDITOR    Ced

; Gate address for E-mail

GATE   2:284/324.999

; Skip Existing Uploads , or allow it and ask a new name

; SKIPEXISTINGUPLOADS

