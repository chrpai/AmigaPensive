FOUND LOGS:TpTCron.log
CHECKDATE 40
DELETE
END

FOUND IN:REGION33.ZIP
NOTIFY 1 Paolo_Carotenuto "%NAME Trovata ed Hatchata..."
HATCH REGION "Lista di Tutte le BBs del NetWork FIDONET" REGION33.ZIP
DELETE
END

FOUND IN:NODEDIFF.???
EVENTLOG Paolo_Carotenuto "%NAME Trovata e' Processata..."
COPY Nodelist:
SCRIPT FIDO:Batch/ProcessDiff.Batch "%NAME"
END

FOUND IN:AMYDIFF.???
EVENTLOG Paolo_Carotenuto "%NAME Trovata e' Processata..."
COPY Nodelist:
SCRIPT FIDO:Batch/ProcessDiff.Batch "%NAME"
END

FOUND IN:VIR_DIFF.???
EVENTLOG Paolo_Carotenuto "%NAME Trovata e' Processata..."
COPY Nodelist:
SCRIPT FIDO:Batch/ProcessDiff.Batch "%NAME"
END

FOUND OUT:BAD/#?
EVENTLOG Paolo_Carotenuto "Il file %NAME e' presente nella tua BAD_DIR"
COMMENT [%NAME] in data: %DTTM
END

FOUND IN:MM_#?
EVENTLOG Paolo_Carotenuto "Il File %NAME e' Presente nella tua INBOUND:"
COMMENT [%NAME] in data: %DTTM
END

DAY 0
FOUND OUT:Bundles/#?
IFSIZE 1000000
EVENTLOG  Paolo_Carotenuto "Il File %NAME Ha superato i 1000k Bytes"
END

DAY 1 2 3 4 5 6 
FOUND FILE:KilledFiles/#?
EVENTLOG  Paolo_Carotenuto "Sposto il File %NAME (%SIZE Butes) nella TKilled"
MOVE DH1:TKilled/
END

DAY 0
FOUND DH1:TKilled/#?
EVENTLOG  Paolo_Carotenuto "Cancello il File %NAME (%SIZE Butes) dalla TKilled"
DELETE
END
